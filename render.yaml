services:
  - type: web
    name: mezunsu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: CACHE_DIR
        value: /tmp/mezunsu-cache
